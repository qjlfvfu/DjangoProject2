events{
worker_connections 1024;
    }
http{
   include /etc/nginx/mime.types ;
   default_type application/octet-stream;
   upstream gjango{
        server web:8000;
  }
  server{
  listen 8000;
  server_name _;
  location /static/{
    alias/app/staticfiles/;
  }
  location/{
  proxy_pass http://django;
  }
  }
   }